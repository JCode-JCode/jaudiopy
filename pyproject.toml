[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaudiopy"
version = "1.0.0"
description = "A Python library for beat making, effects, mixing, mastering, and processing existing audio files (local or web) with a pure-python or numpy engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "J Code" }
]
maintainers = [
    { name = "J Code" }
]
keywords = [
    "audio", "music", "synthesis", "drum-machine", "sequencer",
    "mixing", "mastering", "dsp", "effects", "numpy", "sound"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]

dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.22"]
fast = ["numpy>=1.22", "scipy>=1.8"]
playback = ["simpleaudio>=1.0.4"]
formats = ["pydub>=0.25.1"]
midi = ["mido>=1.3.0"]
all = ["numpy>=1.22", "scipy>=1.8", "simpleaudio>=1.0.4", "pydub>=0.25.1", "mido>=1.3.0"]

[project.urls]
Homepage = "https://github.com/JCode-JCode/jaudiopy"
Repository = "https://github.com/JCode-JCode/jaudiopy"
Issues = "https://github.com/JCode-JCode/jaudiopy/issues"

[tool.setuptools.packages.find]
include = ["jaudiopy*"]